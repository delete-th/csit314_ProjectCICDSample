name: PHP CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2' 
        extensions: mysqli
        coverage: none

    - name: Install Composer dependencies
      run: |
        composer install

    - name: Run PHPUnit tests
      run: |
        ./vendor/bin/phpunit --bootstrap ./vendor/autoload.php ./tests
